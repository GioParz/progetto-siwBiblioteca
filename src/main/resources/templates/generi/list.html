<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<title>Generi Letterari - BibliotecAmica</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<div th:replace="~{fragments/header :: header('pubblico')}"></div>

	<main class="main-content">

		<div>
			<div class="title-box">Generi Letterari</div>
		</div>

		<!-- Solo l'ADMIN può registrare un nuovo genere -->
		<div sec:authorize="hasAuthority('ADMIN')" class="margin-bottom-lg">
			<a th:href="@{/admin/genere/new}" class="main-link admin-btn">+ Aggiungi Nuovo Genere</a>
		</div>

		<div th:if="${#lists.isEmpty(generi)}" class="no-data-msg">
			Non ci sono generi registrati nel sistema.
		</div>

		<table class="library-table table-centered" th:unless="${#lists.isEmpty(generi)}">
			<thead>
				<tr>
					<th>Nome Genere</th>
					<th>Descrizione</th>
					<th>Azioni</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="genere : ${generi}">
					<td th:text="${genere.nome}">Nome Genere</td>
					<td th:text="${genere.descrizione}">Descrizione</td>
					<td>
						<div class="action-buttons-cell">
							<a th:href="@{/genere/{id}(id=${genere.id})}" class="action-link-view">Visualizza</a>
						</div>
					</td>
				</tr>
			</tbody>
		</table>

		<div class="margin-top-lg">
			<a th:href="@{/}" class="back-link">← Torna alla Home</a>
		</div>
	</main>

</body>

</html>
