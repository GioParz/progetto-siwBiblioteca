<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Nuovo Genere - BibliotecAmica</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<div th:replace="~{fragments/header :: header('admin')}"></div>

	<main class="main-content">
		<div>
			<div class="title-box box-admin">Nuovo Genere</div>
		</div>

		<form th:action="@{/admin/generi}" th:object="${genere}" method="post" class="library-form">

			<div th:if="${#fields.hasGlobalErrors()}" class="error-msg">
				<ul class="no-margin">
					<li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore di validazione globale</li>
				</ul>
			</div>

			<div class="form-group">
				<label>Nome del Genere</label>
				<input type="text" th:field="*{nome}" placeholder="Es: Fantasy" />
				<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="field-error"></span>
			</div>

			<div class="form-group">
				<label>Descrizione (opzionale)</label>
				<textarea th:field="*{descrizione}" rows="5"
					placeholder="Breve descrizione del genere letterario..."></textarea>
				<span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" class="field-error"></span>
			</div>

			<div class="margin-top-lg">
				<button type="submit" class="main-link admin-btn">Registra Genere</button>
			</div>
		</form>

		<div class="margin-top-lg">
			<a th:href="@{/generi}" class="back-link">Annulla e torna alla lista</a>
		</div>
	</main>

</body>

</html>
