<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Accesso Negato - BibliotecAmica</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <a th:href="@{/}" class="logo-wrapper">
        <span class="brand-title">📚 Biblio<span>Hub</span></span>
    </a>

    <div class="error-container">
        <div class="error-icon">🔒</div>
        <div class="error-code">403</div>
        <p class="error-subtitle">Questa sezione della biblioteca è ad accesso riservato.</p>
        <p class="error-detail">Non disponi dei permessi necessari per consultare questa pagina.</p>
        <a th:href="@{/}" class="main-link">Torna alla Home</a>
    </div>

</body>
</html>
