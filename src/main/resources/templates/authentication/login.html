<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Accedi - BibliotecAmica</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<div th:replace="~{fragments/header :: header('minimo')}"></div>

	<main class="main-content">

		<div>
			<div class="title-box">Accedi</div>
		</div>

		<!-- Messaggio di credenziali errate (impostato da Spring Security tramite failureUrl) -->
		<div th:if="${param.error}" class="alert alert-danger">
			Username o password non validi. Riprova.
		</div>

		<form th:action="@{/login}" method="post" class="library-form">

			<div class="form-group">
				<label for="username">Username</label>
				<input type="text" id="username" name="username" placeholder="Il tuo username" autofocus />
			</div>

			<div class="form-group">
				<label for="password">Password</label>
				<input type="password" id="password" name="password" placeholder="La tua password" />
			</div>

			<div class="margin-top-lg">
				<button type="submit" class="main-link">Accedi</button>
			</div>
		</form>
		
		<!-- Login con OAuth Google -->
		<div class="margin-top-lg">
		    <p>oppure</p>
		    <a th:href="@{/oauth2/authorization/google}" class="main-link">
		        Accedi con Google
		    </a>
		</div>

		<p class="no-data-msg margin-top-lg">
			Non hai ancora un account? <a th:href="@{/register}">Registrati qui</a>
		</p>

		<div class="margin-top-sm">
			<a th:href="@{/}" class="back-link">← Torna alla Home</a>
		</div>
	</main>

</body>

</html>
