<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Registrati - BibliotecAmica</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<div th:replace="~{fragments/header :: header('minimo')}"></div>

	<main class="main-content">

		<div>
			<div class="title-box">Crea il tuo Account</div>
		</div>

		<form th:action="@{/register}" th:object="${credentials}" method="post" class="library-form">

			<div th:if="${#fields.hasGlobalErrors()}" class="error-msg">
				<ul class="no-margin">
					<li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Errore di validazione globale</li>
				</ul>
			</div>

			<div class="form-group">
				<label>Nome</label>
				<input type="text" th:field="*{utente.nome}" placeholder="Il tuo nome" />
				<span th:if="${#fields.hasErrors('utente.nome')}" th:errors="*{utente.nome}" class="field-error"></span>
			</div>

			<div class="form-group">
				<label>Cognome</label>
				<input type="text" th:field="*{utente.cognome}" placeholder="Il tuo cognome" />
				<span th:if="${#fields.hasErrors('utente.cognome')}" th:errors="*{utente.cognome}"
					class="field-error"></span>
			</div>

			<div class="form-group">
				<label>Email</label>
				<input type="email" th:field="*{utente.email}" placeholder="latua@email.it" />
				<span th:if="${#fields.hasErrors('utente.email')}" th:errors="*{utente.email}"
					class="field-error"></span>
			</div>

			<div class="form-group">
				<label>Username</label>
				<input type="text" th:field="*{username}" placeholder="Scegli un username" />
				<span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="field-error"></span>
			</div>

			<div class="form-group">
				<label>Password</label>
				<input type="password" th:field="*{password}" placeholder="Almeno 3 caratteri" />
				<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></span>
			</div>

			<div class="margin-top-lg">
				<button type="submit" class="main-link">Registrati</button>
			</div>
		</form>

		<p class="no-data-msg margin-top-lg">
			Hai già un account? <a th:href="@{/login}">Accedi qui</a>
		</p>

		<div class="margin-top-sm">
			<a th:href="@{/}" class="back-link">← Torna alla Home</a>
		</div>
	</main>

</body>

</html>
